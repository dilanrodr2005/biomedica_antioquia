<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tecnología Biomédica ESE Antioquia - Piloto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="app">
    <aside id="side" aria-label="Navegación principal">
      <div class="brand">
        <img src="img/logo.png" alt="Gobernación de Antioquia" style="height:56px;width:auto">
        <button id="collapse" aria-label="Contraer menú"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M20 6H8M20 12H8M20 18H8M5 8l-3 4 3 4" />
          </svg></button>
      </div>
      <div class="brandtxt"><u></u><small>SECRETARÍA DE SALUD<br>E INCLUSIÓN SOCIAL</small>
      </div>
      <div id="menu"></div>
    </aside>
    <div class="content">
      <header class="top">
        <div>
          <div class="ttl">Estrategia Departamental de Gestión, Información, Seguimiento y Sostenibilidad de la
            Tecnología Biomédica para las ESE de Antioquia</div>
          <div class="badges"><span>FO-M1-P7-024</span><span>Versión: 2</span><span>Fecha aprobación: 10-08-2022</span>
          </div>
        </div>
        <div class="user">
          <button id="bell" aria-label="Alertas"><svg viewBox="0 0 24 24" width="22" height="22" fill="none"
              stroke="currentColor" stroke-width="1.8">
              <path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4" />
            </svg><i id="nbell"></i></button>
          <svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true">
            <circle cx="20" cy="20" r="20" fill="#cfe0ee" />
            <circle cx="20" cy="15" r="7" fill="#e8b996" />
            <path d="M6 36c1-9 8-12 14-12s13 3 14 12a20 20 0 01-28 0z" fill="#33475b" />
          </svg>
          <div><small>Admin Departamental</small><b>Dilan Rodriguez</b></div>
        </div>
      </header>
      <main id="main"></main>
    </div>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="mbox"><button id="mclose" class="btn s">Cerrar</button>
      <div id="mbody"></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
